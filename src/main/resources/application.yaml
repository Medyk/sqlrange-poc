spring:
  application:
    name: sqlrange
  datasource:
    driver-class-name: org.postgresql.Driver
    username: docker
    password: docker
    url: jdbc:postgresql://localhost:5432/docker
  jpa:
    show-sql: true
  # https://docs.spring.io/spring-boot/reference/using/devtools.html#using.devtools.property-defaults
  web:
    error:
      include-stacktrace: never
